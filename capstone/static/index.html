<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake News Detector</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f26;--muted:#667085;--border:#e4e7ec;--accent:#3b5bdb;
--true:#2b8a3e;--false:#c92a2a;--mislead:#e67700;--unver:#667085}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--text:#eceff4;--muted:#98a2b3;--border:#2c313a;--accent:#748ffc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:1.6rem} .sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:14px}
.card h2{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
textarea{width:100%;min-height:150px;resize:vertical;padding:12px;border-radius:10px;border:1px solid var(--border);
background:var(--card);color:var(--text);font:inherit}
button{margin-top:10px;padding:10px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;color:#fff;font-weight:700}
.true{background:var(--true)} .false{background:var(--false)} .mislead{background:var(--mislead)} .unver{background:var(--unver)}
.muted{color:var(--muted)} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent)}
ul{margin:6px 0 0;padding-left:20px} li{margin:4px 0} a{color:var(--accent);word-break:break-all}
.warn{border-left:4px solid var(--mislead)} .err{border-left:4px solid var(--false)}
.hl{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.hl .w{border-radius:4px;padding:0 2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Fake News Detector</h1>
  <p class="sub">Paste a news article or claim. The ML model checks the writing style, Gemini + Google Search checks the facts.</p>
  <textarea id="text" placeholder="Paste news text here (at least 20 characters)..."></textarea>
  <button id="btn">Analyze</button>
  <div id="out"></div>
  <p class="foot">Educational project. Results can be wrong; always check the linked sources yourself.</p>
</main>
<script>
const out = document.getElementById('out'), btn = document.getElementById('btn');
const BADGE = {True:'true', False:'false', Misleading:'mislead', Unverified:'unver'};

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function card(title, ...kids){ const c = el('div','card'); c.append(el('h2',null,title), ...kids); return c; }
function showError(msg){ out.replaceChildren(card('Error', el('div',null,msg))); out.firstChild.classList.add('err'); }

function highlight(text, weights){
  const map = new Map(Object.entries(weights));
  const max = Math.max(0.0001, ...[...map.values()].map(Math.abs));
  const wrap = el('p','hl'); let last = 0;
  for (const m of text.matchAll(/[A-Za-z]+/g)){
    const w = map.get(m[0].toLowerCase());
    if (w === undefined) continue;
    wrap.append(document.createTextNode(text.slice(last, m.index)));
    const span = el('span','w',m[0]);
    const a = 0.15 + 0.55 * Math.min(1, Math.abs(w) / max);
    span.style.background = (w > 0 ? 'rgba(201,42,42,' : 'rgba(43,138,62,') + a + ')';
    span.title = (w > 0 ? 'fake-leaning ' : 'real-leaning ') + w.toFixed(3);
    wrap.append(span); last = m.index + m[0].length;
  }
  wrap.append(document.createTextNode(text.slice(last)));
  return wrap;
}
function wordList(title, color, items){
  const box = el('div'); const h = el('div','muted'); const dot = el('span','dot'); dot.style.background = color;
  h.append(dot, title); box.append(h);
  const ul = el('ul');
  items.forEach(i => ul.append(el('li',null,i.word + '  (' + Math.abs(i.weight).toFixed(2) + ')')));
  if (!items.length) ul.append(el('li','muted','none'));
  box.append(ul); return box;
}

function render(data, userText){
  const llm = data.llm, ml = data.ml, nodes = [];

  const head = el('div','row');
  head.append(el('span','badge ' + (BADGE[llm.verdict] || 'unver'), llm.verdict),
              el('span','muted','Confidence: ' + Math.round((llm.confidence || 0) * 100) + '%'));
  const v = card('Fact check (Gemini + Google Search)', head, el('p',null,llm.reasoning || ''));
  if (llm.claims && llm.claims.length){
    const ul = el('ul');
    llm.claims.forEach(c => ul.append(el('li',null,c.claim + ' - ' + c.status)));
    v.append(ul);
  }
  if (!llm.grounded){
    v.classList.add('warn');
    v.append(el('p','muted','No web sources were retrieved, so treat this verdict with caution.'));
  }
  nodes.push(v);

  if (llm.sources && llm.sources.length){
    const ul = el('ul');
    llm.sources.forEach(s => {
      if (!/^https?:\/\//i.test(s.url)) return;
      const a = el('a',null,s.title || s.url);
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      const li = el('li'); li.append(a); ul.append(li);
    });
    nodes.push(card('Sources', ul));
  }

  if (ml.available){
    const pct = Math.round(ml.fake_probability * 100);
    const bar = el('div','bar'); const fill = el('div'); fill.style.width = pct + '%'; bar.append(fill);
    nodes.push(card('Writing style (ML model)',
      el('div',null, 'Looks like ' + (ml.label === 'fake-style' ? 'fake-news writing' : 'real-news writing') +
        ' (' + Math.round(ml.confidence * 100) + '% confident)'),
      el('div','muted','Fake-style probability: ' + pct + '%'), bar,
      el('p','muted','This is a style signal only. It does not check whether the claims are true.')));
  } else {
    nodes.push(card('Writing style (ML model)', el('div','muted', ml.message || 'Unavailable')));
  }

  const ex = ml.available && ml.explanation;
  if (ex){
    const cols = el('div','cols');
    cols.append(wordList('Pushes toward FAKE', 'rgb(201,42,42)', ex.top_fake),
                wordList('Pushes toward REAL', 'rgb(43,138,62)', ex.top_real));
    nodes.push(card('Why this style score?',
      el('div','muted','Red = fake-leaning words, green = real-leaning words (darker = stronger).'),
      highlight(userText, ex.word_weights), cols,
      el('p','muted','Explains the ML style signal only. It says nothing about whether the claims are true.')));
  }

  if (ml.available && ((ml.label === 'fake-style' && llm.verdict === 'True') || (ml.label === 'real-style' && llm.verdict === 'False'))){
    const n = card('Note', el('div',null, ml.label === 'fake-style'
      ? 'The writing style looks sensational, but the claims were found to be supported.'
      : 'The writing style looks professional, but the claims were found to be false.'));
    n.classList.add('warn'); nodes.push(n);
  }
  out.replaceChildren(...nodes);
}

btn.addEventListener('click', async () => {
  const text = document.getElementById('text').value.trim();
  if (text.length < 20) return showError('Please enter at least 20 characters.');
  btn.disabled = true; btn.textContent = 'Analyzing...';
  out.replaceChildren(card('Working', el('div','muted','Checking writing style and searching the web. This can take a few seconds.')));
  try {
    const res = await fetch('/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    if (!res.ok) throw new Error(res.status === 422 ? 'Text must be between 20 and 20,000 characters.' : 'Server error (' + res.status + ')');
    render(await res.json(), text);
  } catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.textContent = 'Analyze'; }
});
</script>
</body>
</html>
